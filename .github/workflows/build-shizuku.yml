name: Build ShizukuBridge AAR

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-shizuku.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract Funkin Archiver ZIP
        shell: bash
        run: |
          archive=$(find . -maxdepth 1 -type f -iname 'funkinarchiver.zip' -print -quit)
          if [ -z "$archive" ]; then
            echo 'No se encontró FunkinArchiver_v15*.zip en la raíz del repositorio.'
            exit 1
          fi
          mkdir project
          unzip -q "$archive" -d project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build ShizukuBridge AAR
        working-directory: project/FunkinArchiver/android/shizuku-build
        run: gradle :ShizukuBridge:assembleRelease --no-daemon

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: ShizukuBridge-AAR
          path: project/FunkinArchiver/android/plugins/ShizukuBridge/build/outputs/aar/ShizukuBridge-release.aar
          if-no-files-found: error
